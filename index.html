<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECG Training Hub - 心電図トレーニングシステム</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone (JSXトランスパイル用) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* ECG 方眼紙背景パターン (1mm/5mm目盛準拠デザイン) */
    .ecg-grid-bg {
      background-color: #0b1528;
      background-image: 
        linear-gradient(rgba(30, 58, 138, 0.28) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 58, 138, 0.28) 1px, transparent 1px),
        linear-gradient(rgba(59, 130, 246, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.12) 1px, transparent 1px);
      background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Firebase 初期設定 ---
    const firebaseConfig = {
      apiKey: "AIzaSyDicJ7922MZ73YMZH9Es9lFSaQXaCp4PBs",
      authDomain: "ecc-club-96855.firebaseapp.com",
      projectId: "ecc-club-96855",
      storageBucket: "ecc-club-96855.firebasestorage.app",
      messagingSenderId: "1058732157638",
      appId: "1:1058732157638:web:4929a3f3c86bd91fc285c7",
      measurementId: "G-Y4HMNL0DBT"
    };

    let db = null;
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase Init fallback:", e);
    }

    // --- 初期プリセット問題（Firestoreが空の場合のマスターデータ） ---
    const INITIAL_QUESTIONS = [
      {
        id: "ecg-101",
        title: "不規則なRR間隔と基線の揺れを示す70歳男性の心電図",
        type: "af",
        leadName: "Lead II (25mm/s, 10mm/mV)",
        tags: ["不整脈", "心房細動", "救急", "頻脈"],
        questionText: "70歳男性、動悸と倦怠感を主訴に来院した。心電図所見に基づき、適切な病態または治療選択肢として正しいものを【すべて】選択せよ。",
        options: [
          { key: "A", text: "心房細動（Atrial Fibrillation）である" },
          { key: "B", text: "明瞭なP波と一定のPR間隔が認められる" },
          { key: "C", text: "CHADS2スコアに応じた抗凝固療法の適応を検討する" },
          { key: "D", text: "直ちにアトロピンを静脈内投与する" }
        ],
        correctKeys: ["A", "C"],
        explanationImage: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&auto=format&fit=crop&q=60",
        explanationText: "【診断：心房細動 (Af)】\nRR間隔は完全に不整（irregularly irregular）であり、正常なP波が消失して基線が細かく揺れる細動波（f波）が特徴です。\n血栓塞栓症のリスクを評価し抗凝固療法（DOAC等）を検討します。アトロピンは徐脈性不整脈に用いられるため本症例では不適当です。"
      },
      {
        id: "ecg-102",
        title: "激しい前胸部絞扼感を訴える58歳男性の心電図",
        type: "stemi",
        leadName: "Lead V2-V4 (25mm/s, 10mm/mV)",
        tags: ["虚血性心疾患", "ACS", "STEMI", "緊急カテ"],
        questionText: "58歳男性、冷汗を伴う突然の胸部絞扼感。心電図波形に基づき、直ちに考慮すべき緊急処置および正しい所見を【すべて】選択せよ。",
        options: [
          { key: "A", text: "前壁中隔の急性心筋梗塞（STEMI）を疑う" },
          { key: "B", text: "ST部分の上昇（J点上昇）が顕著である" },
          { key: "C", text: "直ちに冠動脈造影（緊急カテーテル検査）の手配を行う" },
          { key: "D", text: "経過観察として翌日外来受診を指示する" }
        ],
        correctKeys: ["A", "B", "C"],
        explanationImage: "https://images.unsplash.com/photo-1530497610245-94d3c16cda28?w=800&auto=format&fit=crop&q=60",
        explanationText: "【診断：急性ST上昇型前壁中隔心筋梗塞 (STEMI)】\nV2-V4誘導において顕著なST上昇（墓石型/Tombstoning）を認めます。左前下行枝（LAD）の完全閉塞が強く疑われ、Door-to-Balloon時間90分以内の緊急再灌流療法（PCI）が最優先されます。"
      },
      {
        id: "ecg-103",
        title: "意識消失発作（Adams-Stokes症候群）を起こした82歳女性",
        type: "avblock",
        leadName: "Lead II (25mm/s, 10mm/mV)",
        tags: ["徐脈", "房室ブロック", "ペースメーカー", "意識消失"],
        questionText: "82歳女性、急な眼前暗黒感と失神。心電図所見から考えられる病態および対応として正しいものを【すべて】選択せよ。",
        options: [
          { key: "A", text: "完全房室ブロック（第3度房室ブロック）である" },
          { key: "B", text: "P波とQRS群は完全に独立して出現している（房室解離）" },
          { key: "C", text: "一時的または恒久的ペースメーカー植え込みの適応となる" },
          { key: "D", text: "β遮断薬の増量を行う" }
        ],
        correctKeys: ["A", "B", "C"],
        explanationImage: "https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=800&auto=format&fit=crop&q=60",
        explanationText: "【診断：完全房室ブロック (3度AVB)】\nP波の周期（心房）とQRS波の周期（心室補充調律）が完全に独立しており、房室伝導が完全に遮断されています。アダムス・ストークス発作を来しており、緊急のペーシング管理が必要です。房室伝導を抑制するβ遮断薬は禁忌です。"
      }
    ];

    // --- 精密な心電図波形SVGコンポーネント ---
    function ECGWaveform({ type = "af", lead = "Lead II" }) {
      const getPath = () => {
        switch (type) {
          case "stemi":
            return "M 0 65 L 40 65 Q 48 58 55 65 L 68 65 L 72 75 L 77 15 L 85 45 Q 105 45 130 55 L 170 65 L 210 65 L 214 75 L 219 15 L 227 45 Q 247 45 272 55 L 310 65 L 350 65 L 354 75 L 359 15 L 367 45 Q 387 45 412 55 L 470 65 L 510 65 L 514 75 L 519 15 L 527 45 Q 547 45 572 55 L 620 65 L 660 65 L 664 75 L 669 15 L 677 45 Q 697 45 722 55 L 800 65";
          case "avblock":
            return "M 0 65 L 30 65 Q 37 54 45 65 L 70 65 L 73 73 L 78 20 L 84 80 L 88 65 Q 105 52 120 65 L 160 65 Q 167 54 175 65 L 240 65 Q 247 54 255 65 L 280 65 L 283 73 L 288 20 L 294 80 L 298 65 Q 315 52 330 65 L 390 65 Q 397 54 405 65 L 480 65 Q 487 54 495 65 L 510 65 L 513 73 L 518 20 L 524 80 L 528 65 Q 545 52 560 65 L 630 65 Q 637 54 645 65 L 710 65 Q 717 54 725 65 L 800 65";
          case "af":
          default:
            return "M 0 65 Q 5 62 10 67 Q 15 63 20 66 Q 25 61 30 65 L 42 65 L 45 78 L 50 18 L 55 82 L 58 65 Q 68 53 78 65 Q 85 62 90 67 Q 95 63 100 66 L 122 65 L 125 78 L 130 18 L 135 82 L 138 65 Q 148 53 158 65 Q 165 62 170 67 Q 180 63 190 66 Q 200 61 210 65 Q 220 63 230 66 L 252 65 L 255 78 L 260 18 L 265 82 L 268 65 Q 278 53 288 65 Q 295 62 300 67 L 332 65 L 335 78 L 340 18 L 345 82 L 348 65 Q 358 53 368 65 Q 375 62 385 66 Q 400 61 415 65 L 460 65 L 463 78 L 468 18 L 473 82 L 476 65 Q 486 53 496 65 Q 505 62 515 66 L 560 65 L 563 78 L 568 18 L 573 82 L 576 65 Q 586 53 596 65 Q 610 62 625 66 Q 640 61 655 65 L 690 65 L 693 78 L 698 18 L 703 82 L 706 65 Q 716 53 726 65 Q 740 63 755 66 L 800 65";
        }
      };

      return (
        <div className="relative w-full h-44 bg-slate-950 rounded-xl overflow-hidden border border-slate-700/80 shadow-inner">
          <div className="absolute inset-0 ecg-grid-bg opacity-75 pointer-events-none"></div>
          <div className="absolute top-2 left-3 bg-slate-900/90 text-cyan-400 font-mono text-xs px-2.5 py-1 rounded border border-cyan-800/60 shadow-sm flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            {lead}
          </div>
          <div className="absolute top-2 right-3 bg-slate-900/90 text-slate-400 font-mono text-xs px-2 py-0.5 rounded border border-slate-700">
            25 mm/s | 10 mm/mV
          </div>
          <svg className="w-full h-full relative z-10" viewBox="0 0 800 130" preserveAspectRatio="none">
            <path d={getPath()} fill="none" stroke="#22d3ee" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        </div>
      );
    }

    // --- メインアプリケーションコンポーネント ---
    function App() {
      // 職員番号
      const [staffId, setStaffId] = useState(() => localStorage.getItem("ecg_staff_id") || "");
      const [inputStaffId, setInputStaffId] = useState("");

      // タブ
      const [currentTab, setCurrentTab] = useState("practice"); // 'practice' | 'bank' | 'analytics' | 'calendar'

      // データストア
      const [questions, setQuestions] = useState([]);
      const [logs, setLogs] = useState([]);
      const [isSyncing, setIsSyncing] = useState(true);

      // 演習モード
      const [mode, setMode] = useState("all"); // 'all' | 'random' | 'review'
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedAnswers, setSelectedAnswers] = useState([]);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [selectedTagFilter, setSelectedTagFilter] = useState("ALL");

      // 管理者モーダル
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [adminPassInput, setAdminPassInput] = useState("");
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem("ecg_admin_pw") || "0924");
      const [newPasswordInput, setNewPasswordInput] = useState("");

      // 個人詳細モーダル
      const [selectedStaffRecord, setSelectedStaffRecord] = useState(null);

      // 新規作成フォーム
      const [newQ, setNewQ] = useState({
        title: "",
        type: "af",
        leadName: "Lead II",
        tags: "不整脈, 頻脈",
        questionText: "",
        optA: "", optB: "", optC: "", optD: "",
        correctA: false, correctB: false, correctC: false, correctD: false,
        explanationText: "",
        explanationImage: ""
      });

      // --- Firestore リアルタイム同期 ---
      useEffect(() => {
        if (!db) {
          setQuestions(INITIAL_QUESTIONS);
          setIsSyncing(false);
          return;
        }

        // 問題コレクションのリアルタイム監視
        const unsubQ = db.collection("questions").onSnapshot(
          (snapshot) => {
            if (snapshot.empty) {
              // 初回のみプリセットを自動投入
              INITIAL_QUESTIONS.forEach(q => db.collection("questions").doc(q.id).set(q));
            } else {
              const qList = [];
              snapshot.forEach(doc => qList.push({ id: doc.id, ...doc.data() }));
              setQuestions(qList);
            }
            setIsSyncing(false);
          },
          (err) => {
            console.error("Firestore Q err:", err);
            setQuestions(INITIAL_QUESTIONS);
            setIsSyncing(false);
          }
        );

        // 解答ログコレクションのリアルタイム監視
        const unsubLogs = db.collection("logs").onSnapshot(
          (snapshot) => {
            const logList = [];
            snapshot.forEach(doc => logList.push({ id: doc.id, ...doc.data() }));
            setLogs(logList);
          },
          (err) => console.error("Firestore Logs err:", err)
        );

        return () => {
          unsubQ();
          unsubLogs();
        };
      }, []);

      // Lucide アイコンの初期化更新
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentTab, isSubmitted, questions, isAdminOpen, selectedStaffRecord]);

      // --- フィルタリング & 演習出題リスト生成 ---
      const activeQuestions = useMemo(() => {
        let list = [...questions];

        if (selectedTagFilter !== "ALL") {
          list = list.filter(q => q.tags && q.tags.includes(selectedTagFilter));
        }

        if (mode === "random") {
          list = [...list].sort(() => Math.random() - 0.5);
        } else if (mode === "review") {
          const userLogs = logs.filter(l => l.staffId === staffId && !l.isCorrect);
          const wrongQIds = new Set(userLogs.map(l => l.questionId));
          list = list.filter(q => wrongQIds.has(q.id));
        }

        return list;
      }, [questions, mode, logs, staffId, selectedTagFilter]);

      const currentQuestion = activeQuestions[currentIndex] || null;

      // タグ一覧の抽出
      const allTags = useMemo(() => {
        const set = new Set();
        questions.forEach(q => (q.tags || []).forEach(t => set.add(t)));
        return Array.from(set);
      }, [questions]);

      // --- 職員認証処理 ---
      const handleStaffLogin = (e) => {
        e.preventDefault();
        if (!inputStaffId.trim()) return;
        setStaffId(inputStaffId.trim());
        localStorage.setItem("ecg_staff_id", inputStaffId.trim());
      };

      const handleLogout = () => {
        setStaffId("");
        localStorage.removeItem("ecg_staff_id");
      };

      // --- 回答選択 & 判定 ---
      const toggleOption = (key) => {
        if (isSubmitted) return;
        setSelectedAnswers(prev => 
          prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]
        );
      };

      const handleAnswerSubmit = async () => {
        if (!currentQuestion || selectedAnswers.length === 0) return;

        const correct = currentQuestion.correctKeys.slice().sort().join("") === selectedAnswers.slice().sort().join("");
        setIsCorrect(correct);
        setIsSubmitted(true);

        const newLog = {
          staffId,
          questionId: currentQuestion.id,
          questionTitle: currentQuestion.title,
          tags: currentQuestion.tags || [],
          selectedKeys: selectedAnswers,
          correctKeys: currentQuestion.correctKeys,
          isCorrect: correct,
          answeredAt: new Date().toISOString()
        };

        if (db) {
          try {
            await db.collection("logs").add(newLog);
          } catch (e) {
            console.error("Log save err:", e);
          }
        }
      };

      const handleNextQuestion = () => {
        setIsSubmitted(false);
        setSelectedAnswers([]);
        if (currentIndex < activeQuestions.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          setCurrentIndex(0);
        }
      };

      // --- 問題作成 ---
      const handleCreateQuestion = async (e) => {
        e.preventDefault();
        const correctKeys = [];
        if (newQ.correctA) correctKeys.push("A");
        if (newQ.correctB) correctKeys.push("B");
        if (newQ.correctC) correctKeys.push("C");
        if (newQ.correctD) correctKeys.push("D");

        if (correctKeys.length === 0) {
          alert("正解の選択肢を少なくとも1つ選択してください。");
          return;
        }

        const tagArray = newQ.tags.split(",").map(t => t.trim()).filter(Boolean);

        const qData = {
          title: newQ.title,
          type: newQ.type,
          leadName: newQ.leadName,
          tags: tagArray,
          questionText: newQ.questionText,
          options: [
            { key: "A", text: newQ.optA },
            { key: "B", text: newQ.optB },
            { key: "C", text: newQ.optC },
            { key: "D", text: newQ.optD }
          ],
          correctKeys,
          explanationText: newQ.explanationText,
          explanationImage: newQ.explanationImage || "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=800&auto=format&fit=crop&q=60"
        };

        if (db) {
          await db.collection("questions").add(qData);
        } else {
          setQuestions(prev => [{ id: "q-" + Date.now(), ...qData }, ...prev]);
        }

        alert("問題を作成・全端末へ同期しました！");
        setCurrentTab("practice");
        setNewQ({
          title: "", type: "af", leadName: "Lead II", tags: "不整脈",
          questionText: "", optA: "", optB: "", optC: "", optD: "",
          correctA: false, correctB: false, correctC: false, correctD: false,
          explanationText: "", explanationImage: ""
        });
      };

      // --- 管理者パスワード検証 ---
      const verifyAdmin = (e) => {
        e.preventDefault();
        if (adminPassInput === adminPassword) {
          setIsAdminAuthenticated(true);
        } else {
          alert("パスワードが正しくありません。");
        }
        setAdminPassInput("");
      };

      const handlePasswordChange = () => {
        if (!newPasswordInput.trim()) return;
        setAdminPassword(newPasswordInput.trim());
        localStorage.setItem("ecg_admin_pw", newPasswordInput.trim());
        setNewPasswordInput("");
        alert("管理者パスワードを更新しました。");
      };

      // --- JSONエクスポート ---
      const exportQuestionsJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(questions, null, 2));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `ecg_quiz_questions_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      };

      // --- CSVエクスポート ---
      const exportAnalyticsCSV = () => {
        const rows = [["職員番号", "累計解答数", "正解数", "正答率(%)", "直近学習日時", "苦手分野"]];
        const staffMap = {};

        logs.forEach(l => {
          if (!staffMap[l.staffId]) staffMap[l.staffId] = [];
          staffMap[l.staffId].push(l);
        });

        Object.entries(staffMap).forEach(([id, uLogs]) => {
          const total = uLogs.length;
          const correctCount = uLogs.filter(l => l.isCorrect).length;
          const rate = Math.round((correctCount / total) * 100);
          const latest = uLogs.sort((a,b) => new Date(b.answeredAt) - new Date(a.answeredAt))[0]?.answeredAt || "";
          rows.push([id, total, correctCount, rate + "%", latest, ""]);
        });

        const csvContent = "\uFEFF" + rows.map(r => r.join(",")).join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ecg_staff_analytics_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
      };

      // 職員別集計データの作成
      const staffAnalytics = useMemo(() => {
        const map = {};
        logs.forEach(l => {
          if (!map[l.staffId]) {
            map[l.staffId] = { staffId: l.staffId, total: 0, correct: 0, tagStats: {}, lastDate: l.answeredAt, logs: [] };
          }
          const rec = map[l.staffId];
          rec.total += 1;
          rec.logs.push(l);
          if (l.isCorrect) rec.correct += 1;
          if (new Date(l.answeredAt) > new Date(rec.lastDate)) rec.lastDate = l.answeredAt;

          (l.tags || []).forEach(t => {
            if (!rec.tagStats[t]) rec.tagStats[t] = { total: 0, correct: 0 };
            rec.tagStats[t].total += 1;
            if (l.isCorrect) rec.tagStats[t].correct += 1;
          });
        });

        return Object.values(map).map(item => {
          const rate = Math.round((item.correct / item.total) * 100);
          const weakTags = Object.entries(item.tagStats)
            .filter(([t, s]) => s.total >= 2 && (s.correct / s.total) < 0.6)
            .map(([t]) => t);
          return { ...item, rate, weakTags };
        });
      }, [logs]);

      // --- ログイン画面（未認証時） ---
      if (!staffId) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
              <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-500 to-blue-600"></div>
              <div className="text-center mb-8">
                <div className="w-14 h-14 bg-blue-950 border border-blue-600/40 text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-cyan-950/50">
                  <i data-lucide="activity" className="w-8 h-8"></i>
                </div>
                <h1 className="text-2xl font-bold tracking-tight text-white">ECG Training Hub</h1>
                <p className="text-xs text-slate-400 mt-1">医療従事者のための心電図判読・演習システム</p>
              </div>

              <form onSubmit={handleStaffLogin} className="space-y-5">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">職員番号 (Staff ID)</label>
                  <div className="relative">
                    <input
                      type="text"
                      required
                      placeholder="例: N-4028, DR-1092"
                      value={inputStaffId}
                      onChange={(e) => setInputStaffId(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
                    />
                  </div>
                </div>
                <button
                  type="submit"
                  className="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-medium py-3 rounded-xl shadow-lg shadow-cyan-900/30 transition transform active:scale-95 flex items-center justify-center gap-2"
                >

                      <p className="text-xs text-slate-400 line-clamp-2">{q.questionText}</p>
                      <div className="text-xs text-slate-500 pt-2 border-t border-slate-800/60">
                        正解キー: <span className="font-mono text-emerald-400 font-bold">{q.correctKeys.join(", ")}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* 管理者モーダル */}
          {isAdminOpen && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-5">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm flex items-center gap-2">
                    <i data-lucide="shield" className="w-4 h-4 text-cyan-400"></i>
                    管理者コントロール
                  </h3>
                  <button onClick={() => setIsAdminOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {!isAdminAuthenticated ? (
                  <form onSubmit={verifyAdmin} className="space-y-4">
                    <div>
                      <label className="block text-xs text-slate-300 mb-1">管理者パスワードを入力してください</label>
                      <input
                        type="password"
                        required
                        value={adminPassInput}
                        onChange={(e) => setAdminPassInput(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white"
                      />
                    </div>
                    <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium py-2.5 rounded-lg transition">
                      認証する
                    </button>
                  </form>
                ) : (
                  <div className="space-y-4 text-xs">
                    <div className="p-3 bg-slate-950 rounded-lg space-y-2 border border-slate-800">
                      <span className="font-bold text-slate-300 block">パスワードの変更</span>
                      <div className="flex gap-2">
                        <input
                          type="password"
                          placeholder="新しいパスワード"
                          value={newPasswordInput}
                          onChange={(e) => setNewPasswordInput(e.target.value)}
                          className="flex-1 bg-slate-900 border border-slate-700 rounded p-1.5 text-white"
                        />
                        <button onClick={handlePasswordChange} className="bg-blue-600 px-3 py-1.5 rounded text-white font-medium">更新</button>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-950 rounded-lg space-y-2 border border-slate-800">
                      <span className="font-bold text-slate-300 block">問題データ管理</span>
                      <button onClick={exportQuestionsJSON} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 rounded border border-slate-700 flex items-center justify-center gap-1.5">
                        <i data-lucide="file-down" className="w-4 h-4"></i>
                        <span>問題一覧をJSONエクスポート</span>
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 個別カルテ詳細モーダル */}
          {selectedStaffRecord && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="font-bold text-white text-sm">職員カルテ: {selectedStaffRecord.staffId}</h3>
                    <p className="text-xs text-slate-400">正答率: {selectedStaffRecord.rate}% ({selectedStaffRecord.correct}/{selectedStaffRecord.total} 問)</p>
                  </div>
                  <button onClick={() => setSelectedStaffRecord(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2.5 pr-1">
                  {selectedStaffRecord.logs.map((log, i) => (
                    <div key={i} className="p-3 bg-slate-950 border border-slate-800/80 rounded-lg text-xs space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-slate-200">{log.questionTitle}</span>
                        <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${log.isCorrect ? "bg-emerald-950 text-emerald-400 border border-emerald-800" : "bg-rose-950 text-rose-400 border border-rose-800"}`}>
                          {log.isCorrect ? "正解" : "不正解"}
                        </span>
                      </div>
                      <div className="text-slate-400 flex gap-4 text-[11px]">
                        <span>選択: {log.selectedKeys.join(", ")}</span>
                        <span>正解: {log.correctKeys.join(", ")}</span>
                        <span className="text-slate-500 font-mono">{new Date(log.answeredAt).toLocaleString("ja-JP")}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- マウント ---
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
